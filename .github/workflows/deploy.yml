name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  # There is no automated test suite yet (see the production readiness review),
  # so this is a build/import gate rather than a test gate: it installs each
  # service's real dependencies, byte-compiles every module, and imports the
  # app factory with a throwaway SQLite database. That's enough to catch what
  # has actually broken this app before: an import that crashes without its
  # dependency installed (torch/transformers), a syntax error, or a hard
  # crash on startup with no services reachable.
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Byte-compile all modules
        working-directory: backend
        run: python -m compileall -q app run.py application.py

      - name: Import the app factory (smoke test)
        working-directory: backend
        env:
          DATABASE_URI: "sqlite:////tmp/ci_smoke_test.db"
          SECRET_KEY: "ci-smoke-test-only"
        run: |
          python -c "
          from app import create_app, db
          app = create_app()
          with app.app_context():
              db.create_all()
          print('backend app factory OK')
          "

  verify-chatbot-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: chatbot-service/requirements.txt

      - name: Install dependencies
        working-directory: chatbot-service
        run: pip install -r requirements.txt

      - name: Byte-compile all modules
        working-directory: chatbot-service
        run: python -m compileall -q app main.py

      - name: Import the app factory (smoke test)
        working-directory: chatbot-service
        env:
          DATABASE_URL: "sqlite:////tmp/ci_chatbot_smoke_test.db"
        run: |
          python -c "
          from main import create_app
          app = create_app()
          print('chatbot-service app factory OK')
          "

  deploy:
    runs-on: ubuntu-latest
    needs:
      - verify-backend
      - verify-chatbot-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/yeslove-mobile-app
            git pull origin main
            docker compose -f docker-compose.microservices.yml up -d --build
            echo "Deployment complete"
