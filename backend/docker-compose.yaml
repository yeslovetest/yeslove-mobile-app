# Local development infra only: Postgres, Memgraph, Redis, RabbitMQ, a
# throwaway Keycloak (seeded from KeyCloakService/imports if you copy that
# folder's realm-import setup), and a vector Postgres. Run the app itself
# (backend, chatbot-service) directly on your machine against these
# containers, e.g. `python run.py`.
#
# This is NOT the production Keycloak. Production Keycloak is defined and
# deployed separately in KeyCloakService/docker-compose.yaml, hostnamed to
# auth.yeslove.co.uk — the two are kept on different container names on
# purpose so both can run on the same Docker host without colliding.
#
# Production app + chatbot-service (no Keycloak, no local dev infra) is
# defined in docker-compose.microservices.yml at the repo root; it expects
# Keycloak to already be running at the URL in backend/.env.

services:
  postgres:
    image: postgres:14
    container_name: postgres_keycloak_dev
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASS}
      POSTGRES_DB: ${POSTGRESQL_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  memgraph:
    image: memgraph/memgraph:latest
    container_name: memgraph
    ports:
      - "7687:7687"  # Bolt
    volumes:
      - memgraph_data:/var/lib/memgraph

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: memgraph_lab
    ports:
      - "3000:3000"
    depends_on:
      - memgraph

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: testpassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: keycloak_server_dev
    ports:
      - "${PORT_KEYCLOAK}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRESQL_DB}
      KC_DB_USERNAME: ${POSTGRESQL_USER}
      KC_DB_PASSWORD: ${POSTGRESQL_PASS}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}
    command: start-dev
    depends_on:
      - postgres
    restart: unless-stopped

  postgres_vector:
    image: ankane/pgvector:latest
    container_name: postgres_vector
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
      POSTGRES_DB: ${VECTOR_DB_NAME}

    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
    ports: 
      - "5433:5432"
    restart: unless-stopped



volumes:
  postgres_data:
  memgraph_data:
  redis_data:
  rabbitmq_data:
  postgres_vector_data:
