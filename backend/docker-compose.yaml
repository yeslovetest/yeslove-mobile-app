

services:
  postgres:
    image: postgres:14
    container_name: postgres_keycloak
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASS}
      POSTGRES_DB: ${POSTGRESQL_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: keycloak_server
    ports:
      - "${PORT_KEYCLOAK}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRESQL_DB}
      KC_DB_USERNAME: ${POSTGRESQL_USER}
      KC_DB_PASSWORD: ${POSTGRESQL_PASS}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS}
    command: start-dev
    depends_on:
      - postgres
    restart: unless-stopped

  postgres_vector:
    image: ankane/pgvector:latest
    container_name: postgres_vector
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD}
      POSTGRES_DB: ${VECTOR_DB_NAME}

    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
    ports: 
      - "5433:5432"
    restart: unless-stopped



volumes:
  postgres_data:
  postgres_vector_data: